<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telador — Salas</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <style>
      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 40px 20px 56px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      h1 {
        margin: 6px 0 0;
        font-size: 32px;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-size: 15px;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      .row { display: flex; gap: 8px; }
      .row input { flex: 1; }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        cursor: pointer;
        background: linear-gradient(180deg, var(--accent-hi), var(--accent));
        color: #fff;
        font-size: 14px;
        font-weight: 650;
        white-space: nowrap;
      }
      button.ghost {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border: 1px solid var(--line);
      }
      button.danger {
        background: transparent;
        color: var(--danger);
        border: 1px solid rgba(240, 113, 120, 0.35);
      }
      button:disabled { opacity: 0.55; cursor: wait; }
      .msg { min-height: 1.2em; font-size: 13px; color: var(--muted); }
      .msg.error { color: var(--danger); }
      .msg.ok { color: var(--ok); }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px;
        border-radius: var(--radius);
        background: var(--panel);
        border: 1px solid var(--line);
      }
      li code { font-size: 15px; color: var(--text); }
      li .ops { display: flex; gap: 6px; }
      .meta { font-size: 12px; color: #777; }
      .card {
        padding: 16px;
        border-radius: var(--radius);
        background: var(--panel);
        border: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .health {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .nav a {
        color: var(--accent);
        font-size: 13px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="brand">Telador</div>
        <h1>Salas</h1>
        <p>
          Máximo de 5 salas. O nome é a key do <strong>Telador Transmissor</strong>
          e o código da Activity / viewer.
        </p>
        <p class="meta" id="count">0 / 5 salas</p>
        <div class="nav">
          <a href="/?watch=1">Viewer</a>
          <a href="/">Início</a>
          <a href="/status.html">Status</a>
        </div>
      </div>

      <div class="card">
        <div class="sec-title" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Status</div>
        <div class="health" id="health"></div>
      </div>

      <div class="card hidden" id="qr-card">
        <div class="sec-title" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">QR da sala</div>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
          <img id="qr-img" alt="QR da sala" width="140" height="140" style="border-radius:12px;background:#fff;padding:8px" />
          <div>
            <code id="qr-name"></code>
            <p class="meta" id="qr-url" style="margin-top:8px;word-break:break-all"></p>
          </div>
        </div>
      </div>

      <div class="card">
        <div>
          <label for="admin">Chave admin</label>
          <input id="admin" type="password" autocomplete="current-password" />
        </div>
        <div>
          <label for="name">Nova sala</label>
          <div class="row">
            <input id="name" placeholder="ex: festa, squad1" autocomplete="off" spellcheck="false" />
            <button type="button" id="create">Criar</button>
          </div>
        </div>
      </div>

      <div class="msg" id="msg"></div>
      <ul id="list"></ul>
    </main>
    <script type="module" src="/src/salas.js"></script>
  </body>
</html>
